<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V3AI</title>
<meta name="description" content="V3AI — ИИ-помощник: отвечает на вопросы, рисует, помогает с учёбой, пишет тексты, переводит и пишет код.">
<meta name="theme-color" content="#04141f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root {
  --bg: #0b1324;
  --panel: #12203a;
  --panel-2: #182a48;
  --line: #24406a;
  --fg: #eef0ff;
  --muted: #9a9ec8;
  --amber: #ffb547;
  --cyan: #5ce1e6;
  --coral: #ff6b7a;
  --lime: #9be15d;
  --display: "Rubik Mono One", "Arial Black", Impact, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.top h1 { margin: 0; flex: 1; font-family: var(--display); font-size: 22px; letter-spacing: 1px; background: linear-gradient(90deg, #7dffcf, #00b4ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.chip { display: flex; flex-direction: column; align-items: flex-end; padding: 4px 10px; border-radius: 12px; background: var(--panel); }
.chip span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.chip b { font-family: var(--mono); font-size: 16px; color: #7dffcf; }
/* ===== V3AI (twin of AssA) ===== */
#viWrap { display: flex; flex-direction: column; gap: 8px; min-height: calc(100dvh - 190px); }
.vi-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: linear-gradient(135deg, #062a3a, #0a5a4a); border: 1px solid var(--line); }
.vi-head .vi-who { flex: 1; min-width: 0; display: flex; flex-direction: column; } .vi-head b { font-size: 16px; letter-spacing: .5px; } .vi-head small { color: #b8d8f0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vi-head button { flex: none; padding: 8px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; font-weight: 800; cursor: pointer; font-size: 13px; }
.vi-orb { flex: none; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 6%, #7dffcf 14%, #00b4ff 52%, #00e08a 100%); box-shadow: 0 0 16px rgba(138,92,255,.7); animation: viPulse 3s ease-in-out infinite; display: grid; place-items: center; font-weight: 900; font-size: 13px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.vi-orb.think { animation: viSpin 1s linear infinite; background: conic-gradient(#7dffcf, #00b4ff, #00e08a, #7dffcf); }
@keyframes viPulse { 50% { transform: scale(1.07); box-shadow: 0 0 26px rgba(255,79,216,.7); } }
@keyframes viSpin { to { transform: rotate(360deg); } }
.vi-modes { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; } .vi-modes::-webkit-scrollbar { display: none; }
.vi-modes button { flex: none; padding: 7px 11px; border-radius: 999px; border: 2px solid var(--line); background: var(--panel); color: var(--fg); font-weight: 800; font-size: 13px; cursor: pointer; }
.vi-modes button[aria-pressed="true"] { border-color: #2ad1ff; background: rgba(42,209,255,.25); }
.vi-drawer { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
.vi-drawer .vi-ch { display: flex; align-items: center; gap: 6px; } .vi-drawer .vi-ch button { background: none; border: 0; color: var(--fg); cursor: pointer; padding: 8px; border-radius: 10px; font-size: 14px; }
.vi-drawer .vi-ch .vi-open { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .vi-drawer .vi-ch.on .vi-open { background: rgba(42,209,255,.22); }
.vi-drawer .vi-empty { color: var(--muted); font-size: 13px; padding: 6px; }
.vi-log { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; overflow-y: auto; min-height: 240px; max-height: calc(100dvh - 330px); }
.vi-m { max-width: 88%; padding: 10px 12px; border-radius: 16px; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.vi-m.u { align-self: flex-end; background: linear-gradient(135deg, #0a84ff, #00c2a8); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
.vi-m.a { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.vi-m.a p { margin: 0 0 6px; } .vi-m.a p:last-child { margin-bottom: 0; } .vi-m.a ul, .vi-m.a ol { margin: 4px 0 6px; padding-left: 20px; } .vi-m.a h4 { margin: 6px 0 4px; font-size: 15px; color: #c4b0ff; }
.vi-m.a code { font-family: var(--mono); font-size: 13px; background: rgba(0,0,0,.3); padding: 1px 5px; border-radius: 5px; }
.vi-m.a pre { margin: 6px 0; padding: 10px; background: #0a0b1a; border-radius: 10px; overflow-x: auto; } .vi-m.a pre code { background: none; padding: 0; white-space: pre; }
.vi-m img { display: block; max-width: 160px; border-radius: 10px; margin-bottom: 6px; }
.vi-tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; } .vi-tools button { white-space: nowrap; } .vi-tools button { background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--muted); border-radius: 8px; font-size: 12px; padding: 4px 8px; cursor: pointer; }
.vi-dots::after { content: "•••"; letter-spacing: 3px; animation: viBlink 1s infinite; color: var(--muted); } @keyframes viBlink { 50% { opacity: .3; } }
.vi-hello { text-align: center; padding: 18px 8px 6px; color: var(--muted); font-size: 14px; } .vi-hello .vi-orb { width: 72px; height: 72px; margin: 0 auto 10px; font-size: 18px; } .vi-hello b { display: block; color: var(--fg); font-size: 20px; margin-bottom: 4px; }
.vi-sugg { display: flex; flex-wrap: wrap; gap: 6px; } .vi-sugg button { padding: 8px 11px; border-radius: 12px; border: 1px dashed #1fb6c9; background: rgba(42,209,255,.1); color: var(--fg); font-size: 13px; cursor: pointer; text-align: left; }
.vi-imgp { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); } .vi-imgp img { width: 54px; height: 54px; object-fit: cover; border-radius: 10px; } .vi-imgp button { background: none; border: 0; color: var(--coral); font-size: 18px; cursor: pointer; }
.vi-bar { display: flex; align-items: flex-end; gap: 6px; padding: 6px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); position: sticky; bottom: 6px; }
.vi-bar textarea { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 16px; padding: 8px 4px; max-height: 120px; outline: none; }
.vi-bar button { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; font-size: 18px; background: rgba(255,255,255,.08); color: var(--fg); }
.vi-bar #viSend { background: linear-gradient(135deg, #0a84ff, #00e08a); color: #fff; } .vi-bar #viSend[data-stop] { background: var(--coral); } .vi-bar #viMic.rec { background: var(--coral); animation: viBlink 1s infinite; }
.vi-art { position: relative; width: min(300px, 100%); aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #0a0b1a; margin-bottom: 6px; }
.vi-art img { display: block; width: 100%; height: 100%; max-width: none; margin: 0; border-radius: 0; cursor: zoom-in; }
.vi-art.wait { display: grid; place-items: center; background: linear-gradient(110deg, #1c1e3d 30%, #0d4a5a 50%, #1c1e3d 70%); background-size: 300% 100%; animation: viShim 1.4s linear infinite; color: #d8ccff; font-weight: 800; font-size: 14px; text-align: center; padding: 10px; }
@keyframes viShim { to { background-position: -150% 0; } }
.vi-art .vi-off { position: absolute; left: 6px; bottom: 6px; padding: 2px 7px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; font-weight: 800; }
.vi-zoom { position: fixed; inset: 0; z-index: 95; background: rgba(5,5,15,.92); display: grid; place-items: center; padding: 16px; cursor: zoom-out; } .vi-zoom img { width: min(92vw, 640px); border-radius: 14px; }
.vi-note { font-size: 11px; color: var(--muted); text-align: center; margin: 0; }
.vi-orb { font-size: 14px; letter-spacing: -.5px; } .vi-hello .vi-orb { font-size: 24px; }
#viWrap { min-height: calc(100dvh - 90px); }
.vi-log { max-height: calc(100dvh - 300px); }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>V3AI</h1>
    <div class="chip"><span>Вопросов</span><b id="viCount">0</b></div>
  </header>
  <div id="viWrap">
      <div class="vi-head">
        <div class="vi-orb" id="viOrb" aria-hidden="true">V3</div>
        <div class="vi-who"><b>V3AI</b><small id="viStatus">готов помочь</small></div>
        <button type="button" id="viHist" aria-label="Мои чаты">🗂</button>
        <button type="button" id="viNew">＋ Новый</button>
      </div>
      <div class="vi-modes" id="viModes" role="group" aria-label="Режим V3AI"></div>
      <div class="vi-drawer" id="viDrawer" hidden></div>
      <div class="vi-log" id="viLog" aria-live="polite"></div>
      <div class="vi-sugg" id="viSugg"></div>
      <div class="vi-imgp" id="viImgP" hidden></div>
      <form class="vi-bar" id="viForm">
        <button type="button" id="viPic" aria-label="Прикрепить фото" hidden>📷</button>
        <input type="file" id="viFile" accept="image/*" hidden>
        <button type="button" id="viMic" aria-label="Сказать голосом" hidden>🎙</button>
        <textarea id="viInput" rows="1" maxlength="4000" placeholder="Спроси V3AI о чём угодно…" aria-label="Сообщение для V3AI"></textarea>
        <button type="submit" id="viSend" aria-label="Отправить">➤</button>
      </form>
      <p class="vi-note">V3AI — ИИ и может ошибаться. Важное проверяй.</p>
    </div>
</main>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  // Storage that never throws (private mode, blocked site data).
  const store = {
    get(k, d) { try { const v = localStorage.getItem("v3ai:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("v3ai:" + k, JSON.stringify(v)); } catch (e) {} },
  };
  // V3AI was born inside V3 Games; on its own it has no coins or game hero.
  const Hero = { earn() {}, say() {} };
  function updateHub() {}

  /* ================= V3AI — the V3 assistant app (twin of the assistant app) ================= */
  const V3ai = (() => {
    const MODES = [
      { id: "help", ico: "✨", n: "Помощник", hi: "Спрашивай что угодно — объясню, посоветую, придумаю.", p: "Режим «Помощник»: отвечай понятно и по делу, давай практичные советы.", s: ["Чем заняться вечером?", "Почему небо голубое?", "Составь мне план на день"] },
      { id: "art", ico: "🎨", n: "Художник", hi: "Опиши картинку — и я её нарисую! Можно скачать картинкой.", p: "Режим «Художник»: рисуешь картинки по описанию.", s: ["Кот-космонавт на Луне", "Закат над морем и парусник", "Милый дракон охраняет замок"] },
      { id: "gif", ico: "🎞", n: "GIF", hi: "Опиши сцену — и я сделаю анимированный GIF! Его можно скачать и отправить друзьям.", p: "Режим «GIF»: делаешь анимированные GIF по описанию.", s: ["Кот машет лапой", "Ракета летит к звёздам", "Рыбка плавает в аквариуме"] },
      { id: "school", ico: "📚", n: "Учёба", hi: "Объясню любую тему шаг за шагом.", p: "Режим «Учёба»: ты терпеливый учитель. Объясняй шаг за шагом, простыми словами и с примерами. С домашним заданием не давай просто готовый ответ — покажи ход решения. В конце можно задать один короткий вопрос на проверку.", s: ["Объясни дроби на примере пиццы", "Как решить 3x + 5 = 20?", "Кратко о Солнечной системе"] },
      { id: "write", ico: "✍️", n: "Писатель", hi: "Сказки, стихи, поздравления и идеи.", p: "Режим «Писатель»: ты креативный автор. Пиши живые истории, стихи с рифмой, поздравления, придумывай названия и идеи.", s: ["Сказка про кота-космонавта", "Стих на день рождения маме", "Придумай название для моего канала"] },
      { id: "lang", ico: "🌍", n: "Переводчик", hi: "Переведу на любой язык и подскажу произношение.", p: "Режим «Переводчик»: переводи текст пользователя. Если язык не указан: с русского — на английский, с других языков — на русский. Дай перевод, а ниже коротко произношение русскими буквами или полезный нюанс.", s: ["Переведи: «Я люблю играть в футбол»", "«Спасибо» на 5 языках", "Hello, how are you?"] },
      { id: "code", ico: "💻", n: "Код", hi: "Напишу и объясню код.", p: "Режим «Код»: ты опытный программист и наставник. Давай рабочий код в блоках ``` с языком и кратко объясняй, как он работает.", s: ["Игра «Угадай число» на Python", "Что такое переменная?", "Кнопка на HTML, которая меняет цвет"] },
      { id: "fun", ico: "😂", n: "Весельчак", hi: "Шутки, загадки, викторины и игры в слова.", p: "Режим «Весельчак»: ты весёлый друг. Шутки, загадки (ответ не говори сразу), викторины, игры в слова. Только добрый юмор.", s: ["Расскажи смешную шутку", "Загадай загадку", "Давай сыграем в города"] },
    ];
    const OFF = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
    const samplePromise = (window.claude && typeof window.claude.use === "function")
      ? Promise.resolve(window.claude.use("sample")).catch(() => null)
      : Promise.resolve(null);
    const log = $("#viLog"), input = $("#viInput"), sendBtn = $("#viSend"), statusEl = $("#viStatus"), orb = $("#viOrb"), drawer = $("#viDrawer");
    let chats = store.get("v3aiChats", []);
    if (!Array.isArray(chats)) chats = [];
    let cur = store.get("v3aiCur", null), mode = store.get("v3aiMode", "help"), asked = store.get("v3aiAsked", 0) | 0;
    let busy = false, ctl = null, aiOff = false, imgOK = null, pending = null, visible = false;
    const modeOf = (id) => MODES.find((m) => m.id === id) || MODES[0];
    const chat = () => chats.find((c) => c.id === cur) || null;
    const pick = (a) => a[(Math.random() * a.length) | 0];
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function save() {
      chats = chats.slice(0, 30);
      chats.forEach((c) => { c.msgs = c.msgs.slice(-40); });
      let pics = 0; // keep only the 15 newest drawings in storage
      chats.forEach((c) => { for (let i = c.msgs.length - 1; i >= 0; i--) { const m = c.msgs[i]; if (m.svg && ++pics > 15) { delete m.svg; delete m.anim; m.gone = 1; } } });
      store.set("v3aiChats", chats); store.set("v3aiCur", cur); store.set("v3aiMode", mode); store.set("v3aiAsked", asked);
    }

    // Small, safe Markdown: everything is escaped first, then **bold**, `code`, ```blocks```, lists and #headings.
    function inline(s) {
      return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
    }
    function md(src) {
      const parts = String(src).split(/```/);
      let out = "";
      parts.forEach((part, i) => {
        if (i % 2) { const body = part.replace(/^[\w+-]*\n/, ""); out += `<pre><code>${esc(body.replace(/\n$/, ""))}</code></pre>`; return; }
        let list = null;
        const close = () => { if (list) { out += `</${list}>`; list = null; } };
        esc(part).split("\n").forEach((line) => {
          const t = line.trim();
          let m;
          if (!t) { close(); return; }
          if ((m = t.match(/^[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; return; }
          if ((m = t.match(/^\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; return; }
          close();
          if ((m = t.match(/^#{1,4}\s+(.*)/))) { out += `<h4>${inline(m[1])}</h4>`; return; }
          out += `<p>${inline(t)}</p>`;
        });
        close();
      });
      return out;
    }

    function speak(text, btn) {
      if (!("speechSynthesis" in window)) return;
      if (speechSynthesis.speaking) { speechSynthesis.cancel(); if (btn && btn.dataset.on) { delete btn.dataset.on; return; } }
      const plain = text.replace(/```[\s\S]*?```/g, " ").replace(/[*#`]/g, "");
      const u = new SpeechSynthesisUtterance(plain);
      u.lang = /[а-яё]/i.test(plain) ? "ru-RU" : "en-US"; u.rate = 1.05; u.pitch = 1.15;
      if (btn) { btn.dataset.on = "1"; u.onend = u.onerror = () => { delete btn.dataset.on; }; }
      speechSynthesis.speak(u);
    }
    function copy(text, btn) {
      const done = () => { btn.textContent = "✓ Скопировано"; setTimeout(() => { btn.textContent = "📋"; }, 1400); };
      try { navigator.clipboard.writeText(text).then(done, () => {}); } catch (e) { /* optional */ }
    }

    function bubble(m) {
      const el = document.createElement("div");
      el.className = "vi-m " + (m.r === "u" ? "u" : "a");
      if (m.r === "u") {
        if (m.img) { const im = document.createElement("img"); im.src = m.img; im.alt = "Фото"; el.appendChild(im); }
        el.appendChild(document.createTextNode(m.t));
      } else {
        if (m.svg || m.gone) { art(el, m); log.appendChild(el); return el; }
        const body = document.createElement("div"); body.className = "vi-body"; body.innerHTML = md(m.t); el.appendChild(body);
        tools(el, m);
      }
      log.appendChild(el);
      return el;
    }
    function tools(el, m) {
      const bar = document.createElement("div"); bar.className = "vi-tools";
      bar.innerHTML = `<button type="button" data-a="say" aria-label="Озвучить">🔊</button><button type="button" data-a="copy" aria-label="Скопировать">📋</button>`;
      bar.querySelector('[data-a="say"]').addEventListener("click", (e) => speak(m.t, e.currentTarget));
      bar.querySelector('[data-a="copy"]').addEventListener("click", (e) => copy(m.t, e.currentTarget));
      el.appendChild(bar);
    }
    function render() {
      const c = chat(), M = modeOf(c ? c.mode : mode);
      log.innerHTML = "";
      if (!c || !c.msgs.length) {
        log.innerHTML = `<div class="vi-hello"><div class="vi-orb">V3</div><b>Привет! Я V3AI ${M.ico}</b>${esc(M.hi)}</div>`;
      } else c.msgs.forEach(bubble);
      $("#viModes").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === M.id)));
      const sg = $("#viSugg");
      sg.innerHTML = "";
      if (!c || !c.msgs.length) M.s.forEach((s) => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.addEventListener("click", () => send(s)); sg.appendChild(b); });
      $("#viCount").textContent = asked;
      log.scrollTop = log.scrollHeight;
      if (!drawer.hidden) renderDrawer();
    }
    function renderDrawer() {
      drawer.innerHTML = "";
      if (!chats.length) { drawer.innerHTML = '<div class="vi-empty">Пока нет чатов. Задай первый вопрос!</div>'; return; }
      chats.forEach((c) => {
        const row = document.createElement("div"); row.className = "vi-ch" + (c.id === cur ? " on" : "");
        row.innerHTML = `<button type="button" class="vi-open"></button><button type="button" aria-label="Удалить чат">🗑</button>`;
        row.firstChild.textContent = modeOf(c.mode).ico + " " + (c.title || "Новый чат");
        row.firstChild.addEventListener("click", () => { stop(); cur = c.id; mode = c.mode; drawer.hidden = true; save(); render(); });
