<style>

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }

.vi-m img { display: block; max-width: 160px; border-radius: 10px; margin-bottom: 6px; }
.vi-tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; } .vi-tools button { white-space: nowrap; } .vi-tools button { background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--muted); border-radius: 8px; font-size: 12px; padding: 4px 8px; cursor: pointer; }

.vi-sugg { display: flex; flex-wrap: wrap; gap: 6px; } .vi-sugg button { padding: 8px 11px; border-radius: 12px; border: 1px dashed #1fb6c9; background: rgba(42,209,255,.1); color: var(--fg); font-size: 13px; cursor: pointer; text-align: left; }
.vi-imgp { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); } .vi-imgp img { width: 54px; height: 54px; object-fit: cover; border-radius: 10px; } .vi-imgp button { background: none; border: 0; color: var(--coral); font-size: 18px; cursor: pointer; }
.vi-bar { display: flex; align-items: flex-end; gap: 6px; padding: 6px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); position: sticky; bottom: 6px; }
.vi-bar textarea { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 16px; padding: 8px 4px; max-height: 120px; outline: none; }
.vi-bar button { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; font-size: 18px; background: rgba(255,255,255,.08); color: var(--fg); }
.vi-bar #viSend { background: linear-gradient(135deg, #0a84ff, #00e08a); color: #fff; } .vi-bar #viSend[data-stop] { background: var(--coral); } .vi-bar #viMic.rec { background: var(--coral); animation: viBlink 1s infinite; }

.vi-art img { display: block; width: 100%; height: 100%; max-width: none; margin: 0; border-radius: 0; cursor: zoom-in; }
.vi-art.wait { display: grid; place-items: center; background: linear-gradient(110deg, #1c1e3d 30%, #0d4a5a 50%, #1c1e3d 70%); background-size: 300% 100%; animation: viShim 1.4s linear infinite; color: #d8ccff; font-weight: 800; font-size: 14px; text-align: center; padding: 10px; }
@keyframes viShim { to { background-position: -150% 0; } }
.vi-art .vi-off { position: absolute; left: 6px; bottom: 6px; padding: 2px 7px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; font-weight: 800; }
.vi-zoom { position: fixed; inset: 0; z-index: 95; background: rgba(5,5,15,.92); display: grid; place-items: center; padding: 16px; cursor: zoom-out; } .vi-zoom img { width: min(92vw, 640px); border-radius: 14px; }
.vi-note { font-size: 11px; color: var(--muted); text-align: center; margin: 0; }
.vi-orb { font-size: 14px; letter-spacing: -.5px; } .vi-hello .vi-orb { font-size: 24px; }
.vi-art video { display: block; width: 100%; height: 100%; background: #000; }
.vi-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 18px; border-radius: 999px; border: 0; background: rgba(0,0,0,.65); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.vi-play:disabled { cursor: default; }
.top { position: relative; }
.vi-mdl { flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid #1fb6c9; background: rgba(31,182,201,.12); color: #7dffcf; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap; }
.vi-models { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; padding: 8px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
.vi-models button { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 2px solid transparent; background: var(--panel-2); cursor: pointer; }

.vi-models b { font-size: 15px; } .vi-models i { font-style: normal; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(125,255,207,.15); color: #7dffcf; align-self: center; }
.vi-models small { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.vi-tools .vi-by { font-size: 11px; color: var(--muted); align-self: center; padding: 0 4px; }
.vi-m.wide { max-width: 100%; width: 100%; }
.vi-game { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 68dvh; border-radius: 14px; overflow: hidden; background: #000; margin-bottom: 6px; }
.vi-game iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
.vi-game.wait { display: grid; place-items: center; color: #fff; font-weight: 800; text-align: center; padding: 12px; background: linear-gradient(110deg, #0d2a3a 30%, #0d4a5a 50%, #0d2a3a 70%); background-size: 300% 100%; animation: viGameWait 1.4s linear infinite; }
@keyframes viGameWait { to { background-position: -300% 0; } }
.vi-gerr { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 6px; padding: 8px 10px; border-radius: 12px; background: rgba(255,107,122,.15); border: 1px solid rgba(255,107,122,.5); font-size: 13px; }
.vi-gerr button { padding: 6px 10px; border-radius: 10px; border: 0; background: var(--coral); color: #fff; font-weight: 800; cursor: pointer; }
.vi-code { max-height: 300px; overflow: auto; margin: 6px 0; padding: 10px; border-radius: 10px; background: #0a0b1a; font-family: var(--mono); font-size: 11.5px; white-space: pre; }
.vi-full { position: fixed; inset: 0; z-index: 96; background: #000; display: flex; flex-direction: column; }
.vi-full > div { display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top, 0px)) 12px 8px; background: #04141f; color: #7dffcf; font-weight: 800; }
.vi-full > div b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vi-full > div button { padding: 7px 12px; border-radius: 10px; border: 1px solid #1fb6c9; background: rgba(31,182,201,.15); color: #fff; font-weight: 800; cursor: pointer; }
.vi-full iframe { flex: 1; width: 100%; border: 0; background: #000; }
#viWrap { min-height: calc(100dvh - 90px); }
.vi-log { max-height: calc(100dvh - 300px); }
</style>
</head>

    function md(src) {

        if (i % 2) { const body = part.replace(/^[\w+-]*\n/, ""); out += `<pre><code>${esc(body.replace(/\n$/, ""))}</code></pre>`; return; }
        let list = null;
        const close = () => { if (list) { out += `</${list}>`; list = null; } };
        esc(part).split("\n").forEach((line) => {
          const t = line.trim();
          let m;
          if (!t) { close(); return; }
          if ((m = t.match(/^[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; return; }
          if ((m = t.match(/^\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; return; }
          close();
          if ((m = t.match(/^#{1,4}\s+(.*)/))) { out += `<h4>${inline(m[1])}</h4>`; return; }
          out += `<p>${inline(t)}</p>`;

        close();

    function wantsArt(q, M) {

    function wantsGif(q, M) {

    function cleanSvg(src) {

      const BAD = ["script", "foreignobject", "iframe", "a", "audio", "video", "animate", "set", "animatetransform", "animatemotion", "image"];

          else if (e && e.text) { svg = cleanSvg(e.text); if (gif) anim = parseAnim(e.text); }
        }
        ctl = null;
      }
      if (!svg && cap !== "Рисование остановлено.") {
        svg = offlineArt(q); off = true;
        if (!cap) cap = sample && !aiOff ? "Не получилось нарисовать подробно — вот быстрый набросок. Нажми «Ещё вариант»!" : gif ? "Это быстрый офлайн-GIF. Внутри Claude я делаю подробные анимации!" : "Это быстрый офлайн-набросок. Внутри Claude я рисую по-настоящему подробные картинки!";
      }
      el.remove();
      const am = svg ? { r: "a", t: cap || (gif ? "Готово! Вот твой GIF 🎞" : "Готово! Вот твоя картинка 🎨"), q, svg } : { r: "a", t: cap || "Не получилось нарисовать." };
      if (svg && !off) am.by = mdl().n;
      if (svg && gif) { am.gif = 1; if (anim && !off) am.anim = anim; }
      if (off) am.off = 1;
      if (svg && !off) Hero.earn(1);
      bubble(am);
      c.msgs.push(am); save();
      done(sample);
    }
    function stop() { if (ctl) ctl.abort(); if ("speechSynthesis" in window) speechSynthesis.cancel(); }

    // Photo questions: only when this view may send images to Claude.
    function clearImg() { pending = null; $("#viImgP").hidden = true; $("#viImgP").innerHTML = ""; $("#viFile").value = ""; }
    function shrink(file, max, q) {
      return new Promise((res, rej) => {
        const url = URL.createObjectURL(file), im = new Image();
        im.onload = () => {
          const k = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement("canvas");
          cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
          cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
          cv.toBlob((b) => (b ? res({ blob: b, url: cv.toDataURL("image/jpeg", q) }) : rej()), "image/jpeg", 0.85);
        };
        im.onerror = () => { URL.revokeObjectURL(url); rej(); };
        im.src = url;
      });
    }
    $("#viPic").addEventListener("click", () => $("#viFile").click());
    $("#viFile").addEventListener("change", async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      try {
        const big = await shrink(f, 1280, 0.8), small = await shrink(f, 200, 0.6);
        pending = { blob: big.blob, thumb: small.url };
        const p = $("#viImgP"); p.hidden = false;
        p.innerHTML = `<img alt="Фото"><span>Фото прикреплено — спроси о нём</span><button type="button" aria-label="Убрать фото">✕</button>`;
        p.querySelector("img").src = small.url; p.querySelector("button").addEventListener("click", clearImg);
        input.focus();
      } catch (err) { setStatus("не удалось открыть фото", false); }
    });

    // Voice input where the browser supports it (the Claude viewer blocks the microphone).
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    if (SR) {
      $("#viMic").hidden = false;
      $("#viMic").addEventListener("click", () => {
        if (rec) { rec.stop(); return; }
        try {
          rec = new SR(); rec.lang = "ru-RU"; rec.interimResults = true;
          rec.onresult = (ev) => { input.value = Array.from(ev.results).map((r) => r[0].transcript).join(""); fitInput(); };
          rec.onerror = () => { setStatus("микрофон недоступен", false); };
          rec.onend = () => { $("#viMic").classList.remove("rec"); rec = null; if (input.value.trim()) send(); };
          rec.start(); $("#viMic").classList.add("rec"); setStatus("слушаю…", false);
        } catch (e) { rec = null; setStatus("микрофон недоступен", false); }
      });
    }

    function fitInput() { input.style.height = "auto"; input.style.height = Math.min(120, input.scrollHeight) + "px"; }
    $("#viModes").innerHTML = MODES.map((m) => `<button type="button" data-m="${m.id}" aria-pressed="false">${m.ico} ${m.n}</button>`).join("");
    $("#viModes").addEventListener("click", (e) => { const b = e.target.closest("button[data-m]"); if (b) setMode(b.dataset.m); });
    $("#viForm").addEventListener("submit", (e) => { e.preventDefault(); if (busy) stop(); else send(); });
    input.addEventListener("input", fitInput);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) send(); } });
    $("#viNew").addEventListener("click", newChat);
    $("#viHist").addEventListener("click", () => { drawer.hidden = !drawer.hidden; if (!drawer.hidden) renderDrawer(); });
    samplePromise.then(async (s) => {
      if (!s) { setStatus("офлайн-режим", false); return; }
      try { const lim = await s.limits(); imgOK = !!(lim && lim.images); if (lim && Array.isArray(lim.modelTiers)) tiers = lim.modelTiers; } catch (e) { imgOK = false; }
      $("#viPic").hidden = !imgOK;
    });

    visible = true; render();
    return {
      enter() { visible = true; render(); Hero.say("v3ai", "start", "V3AI на связи! Спрашивай что угодно."); },
      leave() { visible = false; stop(); },
      key() {},
      best: () => (asked ? String(asked) : "—"),
    };
  })();

  document.addEventListener("visibilitychange", () => { if (document.hidden) V3ai.leave(); else V3ai.enter(); });
})();
</script>
</body>
</html>
