<title>Ayte V3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: two panes (chats | conversation); below 820px one pane at a time. Sheets slide up from the bottom. */
:root {
  --bg: #e9eeec; --side: #f7f9f8; --panel: #ffffff; --raise: #eef2f0; --line: #dbe2df;
  --ink: #14211d; --muted: #63736d; --accent: #ec5a2a; --accent-ink: #ffffff; --accent-soft: #fde5da;
  --in: #ffffff; --in-line: #e2e8e5; --out: #ffd9c8; --out-ink: #3b1406; --out-meta: #9a4b2d;
  --wall: rgba(20, 33, 29, .055); --green: #18995c; --red: #d23b3b; --scrim: rgba(12, 20, 18, .45);
  --shadow: 0 18px 50px rgba(15, 30, 25, .18);
  --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1110; --side: #101817; --panel: #131d1b; --raise: #1a2624; --line: #24322e;
  --ink: #e5eeea; --muted: #8a9b95; --accent: #ff7247; --accent-ink: #1a0a04; --accent-soft: #3a1c12;
  --in: #172320; --in-line: #22312d; --out: #5b2513; --out-ink: #ffeee6; --out-meta: #f2a88c;
  --wall: rgba(229, 238, 234, .045); --green: #3ccf86; --red: #ff6b6b; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 18px 50px rgba(0, 0, 0, .55); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1110; --side: #101817; --panel: #131d1b; --raise: #1a2624; --line: #24322e;
  --ink: #e5eeea; --muted: #8a9b95; --accent: #ff7247; --accent-ink: #1a0a04; --accent-soft: #3a1c12;
  --in: #172320; --in-line: #22312d; --out: #5b2513; --out-ink: #ffeee6; --out-meta: #f2a88c;
  --wall: rgba(229, 238, 234, .045); --green: #3ccf86; --red: #ff6b6b; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 18px 50px rgba(0, 0, 0, .55); color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
.ico { width: 20px; height: 20px; }

.app { height: 100%; display: grid; grid-template-columns: 340px minmax(0, 1fr); background: var(--panel); overflow: hidden; position: relative; }
@media (min-width: 821px) {
  body { padding: 16px var(--gr) 16px var(--gl); }
  .app { max-width: 1240px; margin: 0 auto; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
  .side, .chat-head, .msgs, .composer, .pinbar, .find { --gl: 16px; --gr: 16px; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .app[data-view="list"] .chat { display: none; }
  .app[data-view="chat"] .side { display: none; }
}

/* ---------- sidebar ---------- */
.side { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
.side-head { display: flex; align-items: center; gap: 12px; padding: 14px var(--gr) 10px var(--gl); }
.logo { flex: 1; font: 22px/1 var(--display); letter-spacing: -.01em; display: flex; align-items: baseline; gap: 6px; }
.logo b { font-weight: 400; color: var(--accent); margin-left: -6px; }
.logo span { font: 700 11px/1 var(--body); letter-spacing: .12em; padding: 4px 6px; border-radius: 6px; background: var(--ink); color: var(--side); transform: translateY(-3px); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; color: var(--ink); flex-shrink: 0; }
.icon-btn:hover { background: var(--raise); }
.icon-btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.me-btn { border: 0; background: none; padding: 0; border-radius: 50%; flex-shrink: 0; }
.search { margin: 0 var(--gr) 10px var(--gl); display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; background: var(--raise); color: var(--muted); border: 1px solid transparent; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 10px 0; color: var(--ink); }
.search .ico { width: 17px; height: 17px; }
.folders { display: flex; gap: 6px; padding: 0 var(--gr) 10px var(--gl); overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.folders button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.folders button[aria-pressed="true"] { background: var(--ink); color: var(--side); border-color: var(--ink); }
.folders i { font-style: normal; font-size: 11px; min-width: 18px; padding: 1px 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); }
.list { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: thin; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px var(--gr) 9px var(--gl); border: 0; background: none; text-align: left; }
.row:hover { background: var(--raise); }
.row[aria-current="true"] { background: var(--accent-soft); }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row-top, .row-bot { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row-name { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.row-name .ico { width: 14px; height: 14px; color: var(--muted); flex-shrink: 0; }
.row time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.row-prev { flex: 1; min-width: 0; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-prev b { font-weight: 600; color: var(--ink); }
.row-prev.typing { color: var(--accent); }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
.badge.quiet { background: var(--line); color: var(--muted); }
.list-note { padding: 18px var(--gr) 18px var(--gl); color: var(--muted); font-size: 13.5px; display: grid; gap: 10px; justify-items: start; }
.list-note strong { color: var(--ink); font-size: 15px; }
.side-foot { padding: 10px var(--gr) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gl); border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.side-foot .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.side-foot .led.on { background: var(--green); }

/* ---------- avatars ---------- */
.av { --s: 44px; position: relative; width: var(--s); height: var(--s); border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; background: var(--c, var(--accent)); color: #fff; font-weight: 700; font-size: calc(var(--s) * .38); line-height: 1; }
.av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.av .em { font-size: calc(var(--s) * .52); }
.av .dot { position: absolute; right: 0; bottom: 0; width: calc(var(--s) * .28); height: calc(var(--s) * .28); min-width: 10px; min-height: 10px; border-radius: 50%; background: var(--green); border: 2px solid var(--side); }

/* ---------- conversation ---------- */
.chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); position: relative; }
.empty { margin: auto; padding: 24px; max-width: 360px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty .mark { font: 54px/1 var(--display); color: var(--ink); }
.empty .mark b { color: var(--accent); font-weight: 400; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 10px var(--gr) 10px var(--gl); border-bottom: 1px solid var(--line); background: var(--panel); --ring: var(--panel); }
.chat-head .av .dot { border-color: var(--panel); }
.who { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; }
.who-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-sub.on { color: var(--green); }
.who-sub.typing { color: var(--accent); }
.ghost { border: 0; background: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); flex-shrink: 0; }
.ghost:hover { background: var(--raise); color: var(--ink); }
.back { display: none; margin-left: -8px; }
@media (max-width: 820px) { .back { display: grid; } }
.pinbar { display: flex; align-items: center; gap: 10px; padding: 8px var(--gr) 8px var(--gl); border-bottom: 1px solid var(--line); background: var(--side); font-size: 13.5px; }
.pinbar button.go { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; display: grid; }
.pinbar small { color: var(--accent); font-weight: 700; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; }
.pinbar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.find { display: flex; gap: 8px; align-items: center; padding: 8px var(--gr) 8px var(--gl); border-bottom: 1px solid var(--line); }
.find input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); padding: 8px 10px; }
.find small { color: var(--muted); font-variant-numeric: tabular-nums; }

.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 10px var(--gr) 14px var(--gl); display: flex; flex-direction: column; gap: 2px; scrollbar-width: thin;
  background-color: var(--panel); background-image: radial-gradient(var(--wall) 1.2px, transparent 1.4px), radial-gradient(var(--wall) 1.2px, transparent 1.4px); background-size: 26px 26px; background-position: 0 0, 13px 13px; }
.day { align-self: center; margin: 12px 0 6px; padding: 3px 12px; border-radius: 999px; background: var(--raise); font-size: 12px; font-weight: 600; color: var(--muted); }
.sys { align-self: center; margin: 6px 0; padding: 5px 12px; border-radius: 12px; background: var(--raise); color: var(--muted); font-size: 12.5px; text-align: center; max-width: 90%; }
.m { display: flex; gap: 8px; align-items: flex-end; }
.m.me { justify-content: flex-end; }
.m.first { margin-top: 8px; }
.m-av { width: 32px; flex-shrink: 0; }
.m-body { max-width: min(78%, 540px); min-width: 0; display: grid; gap: 3px; }
.me .m-body { justify-items: end; }
.bubble { position: relative; background: var(--in); border: 1px solid var(--in-line); border-radius: 18px; padding: 7px 11px 5px; overflow-wrap: anywhere; min-width: 64px; cursor: default; user-select: text; }
.m.first .bubble { border-top-left-radius: 6px; }
.me .bubble { background: var(--out); border-color: transparent; color: var(--out-ink); }
.m.me.first .bubble { border-top-left-radius: 18px; border-top-right-radius: 6px; }
.bubble.sticker { background: none; border: 0; padding: 0; }
.bubble.photo { padding: 4px 4px 5px; }
.bubble.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.bubble.new { animation: pop .18s ease-out; }
@keyframes pop { from { transform: translateY(6px) scale(.97); opacity: .4; } to { transform: none; opacity: 1; } }
.sender { font-size: 12.5px; font-weight: 700; color: var(--c, var(--accent)); }
.text { white-space: pre-wrap; }
.text mark { background: var(--accent); color: var(--accent-ink); border-radius: 3px; }
.fwd { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
.me .fwd { color: var(--out-meta); }
.quote { display: block; width: 100%; border: 0; text-align: left; margin: 2px 0 4px; padding: 4px 8px; border-left: 3px solid var(--accent); border-radius: 6px; background: var(--raise); font-size: 13px; }
.me .quote { background: rgba(255, 255, 255, .28); border-left-color: var(--out-meta); color: inherit; }
.quote b { display: block; font-size: 12px; color: var(--accent); }
.me .quote b { color: var(--out-meta); }
.quote span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.me .quote span { color: inherit; opacity: .8; }
.ph { display: block; width: 100%; max-width: 320px; max-height: 360px; object-fit: cover; border-radius: 14px; cursor: zoom-in; background: var(--raise); }
.bubble.photo .text { padding: 4px 7px 0; }
.meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 1px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.me .meta { color: var(--out-meta); }
.bubble.sticker .meta { padding: 2px 8px; border-radius: 10px; background: var(--raise); color: var(--muted); justify-self: end; width: max-content; margin-left: auto; }
.ticks { letter-spacing: -3px; padding-right: 3px; }
.stk { width: 140px; height: 140px; }
.rxs { display: flex; flex-wrap: wrap; gap: 4px; }
.rx { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.rx.mine { border-color: var(--accent); background: var(--accent-soft); }
.poll { display: grid; gap: 6px; min-width: min(260px, 60vw); padding: 2px 0 2px; }
.poll h4 { margin: 0; font-size: 15px; }
.poll small { color: var(--muted); font-size: 12px; }
.me .poll small { color: var(--out-meta); }
.opt { position: relative; overflow: hidden; display: flex; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--panel); text-align: left; color: var(--ink); }
.opt .bar { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); z-index: 0; transition: width .3s; }
.opt span, .opt b { position: relative; z-index: 1; }
.opt b { font-variant-numeric: tabular-nums; font-size: 13px; }
.opt.mine { border-color: var(--accent); }
.typing-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; color: var(--muted); font-size: 13px; }
.dots { display: inline-flex; gap: 4px; padding: 10px 12px; border-radius: 16px; background: var(--in); border: 1px solid var(--in-line); }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 40px; }
.chips button { border: 1px solid var(--accent); color: var(--accent); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; }

/* ---------- composer ---------- */
.composer { position: relative; padding: 8px var(--gr) calc(8px + env(safe-area-inset-bottom, 0px)) var(--gl); border-top: 1px solid var(--line); background: var(--panel); }
.ctx { display: flex; align-items: center; gap: 10px; padding: 4px 0 8px; font-size: 13px; }
.ctx > div { flex: 1; min-width: 0; border-left: 3px solid var(--accent); padding-left: 8px; }
.ctx b { display: block; color: var(--accent); font-size: 12.5px; }
.ctx span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.c-row { display: flex; align-items: flex-end; gap: 4px; }
#input { flex: 1; min-width: 0; resize: none; max-height: 140px; border: 1px solid var(--line); background: var(--raise); border-radius: 20px; padding: 9px 14px; line-height: 1.4; outline: none; }
#input:focus { border-color: var(--accent); }
#input::placeholder { color: var(--muted); }
.send { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex-shrink: 0; transition: transform .12s; }
.send:active { transform: scale(.92); }
.send:disabled { opacity: .45; cursor: default; }
.c-alt { display: flex; gap: 8px; justify-content: center; align-items: center; color: var(--muted); font-size: 13.5px; text-align: center; min-height: 42px; flex-wrap: wrap; }
.panel { position: absolute; left: var(--gl); right: var(--gr); bottom: calc(100% + 8px); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 8px; max-width: 420px; display: grid; gap: 8px; }
.tabs { display: flex; gap: 4px; }
.tabs button { flex: 1; border: 0; border-radius: 10px; padding: 7px; background: none; font-weight: 600; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--raise); color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; max-height: 260px; overflow-y: auto; }
.grid.stks { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.grid button { border: 0; background: none; border-radius: 10px; aspect-ratio: 1; font-size: 24px; display: grid; place-items: center; padding: 2px; }
.grid button:hover { background: var(--raise); }
.grid .stk { width: 100%; height: auto; }
.attach-menu { position: absolute; left: var(--gl); bottom: calc(100% + 8px); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: grid; min-width: 190px; }

/* ---------- menus, sheets, overlays ---------- */
.menu-item { display: flex; align-items: center; gap: 12px; border: 0; background: none; border-radius: 10px; padding: 10px 12px; text-align: left; font-size: 14.5px; color: var(--ink); width: 100%; }
.menu-item:hover { background: var(--raise); }
.menu-item .ico { color: var(--muted); }
.menu-item.danger, .menu-item.danger .ico { color: var(--red); }
.scrim { position: fixed; inset: 0; z-index: 100; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; padding: 16px var(--gr) 0 var(--gl); }
@media (min-width: 821px) { .scrim { align-items: center; padding-bottom: 16px; } }
.sheet { width: min(460px, 100%); max-height: min(86vh, 760px); display: flex; flex-direction: column; background: var(--panel); border-radius: 22px 22px 0 0; box-shadow: var(--shadow); animation: up .2s ease-out; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 821px) { .sheet { border-radius: 22px; } }
@keyframes up { from { transform: translateY(24px); opacity: .5; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px 18px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; margin: 0; font-size: 17px; text-wrap: balance; }
.sheet-body { overflow-y: auto; padding: 14px 18px 18px; display: grid; gap: 14px; align-content: start; }
.actions { width: min(340px, 100%); background: var(--panel); border-radius: 20px; box-shadow: var(--shadow); padding: 8px; margin-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 2px; animation: up .16s ease-out; }
.rx-row { display: flex; justify-content: space-between; padding: 4px 4px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.rx-row button { border: 0; background: none; font-size: 26px; width: 44px; height: 44px; border-radius: 50%; }
.rx-row button:hover, .rx-row button.mine { background: var(--accent-soft); }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.input { width: 100%; border: 1px solid var(--line); background: var(--raise); border-radius: 12px; padding: 10px 12px; outline: none; color: var(--ink); }
.input:focus { border-color: var(--accent); }
textarea.input { resize: vertical; min-height: 64px; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.sec { background: var(--raise); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--red); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; background: var(--c); }
.swatches button[aria-pressed="true"] { border-color: var(--ink); }
.emopick { display: flex; gap: 4px; flex-wrap: wrap; }
.emopick button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid transparent; background: var(--raise); font-size: 20px; }
.emopick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: none; padding: 8px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.people { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.person { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; border-radius: 12px; padding: 7px 8px; text-align: left; }
.person:hover { background: var(--raise); }
.person .av .dot { border-color: var(--panel); }
.person > span:not(.av) { flex: 1; min-width: 0; display: grid; }
.person b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person small { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person small.on { color: var(--green); }
.person input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.person > .tag { flex: 0 0 auto; display: inline-block; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }
.hero { display: grid; justify-items: center; gap: 6px; text-align: center; }
.hero h3 { margin: 6px 0 0; font-size: 19px; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); font-size: 13.5px; }
.note { margin: 0; font-size: 12.5px; color: var(--muted); }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.opts { display: grid; gap: 6px; }
.viewer { position: fixed; inset: 0; z-index: 150; background: rgba(0, 0, 0, .88); display: grid; place-items: center; padding: 16px var(--gr) 16px var(--gl); cursor: zoom-out; }
.viewer img { max-width: 100%; max-height: 100%; border-radius: 10px; }
.toasts { position: fixed; z-index: 200; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(380px, calc(100% - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--ink); color: var(--panel); box-shadow: var(--shadow); font-size: 14px; border: 0; text-align: left; animation: up .2s ease-out; }

/* ================= storage backends (same interface: shared db or this device only) ================= */
function makeQueue() {
  const tails = new Map();
  return (key, fn) => {
    const p = (tails.get(key) || Promise.resolve()).then(() => {}, () => {}).then(fn);
    tails.set(key, p);
    const clean = () => { if (tails.get(key) === p) tails.delete(key); };
    p.then(clean, clean);
    return p;
  };
}
function dbBackend(db, me) {
  const q = makeQueue();
  const rows = (s) => s.docs.map((d) => Object.assign({ id: d.id }, d.data()));
  const cached = (s) => !!(s.metadata && s.metadata.fromCache);
  const priv = (k) => db.doc("data/users/" + me + "/" + k);
  return {
    local: false,
    watchChats: (cb, err) => db.collection("chats").where("members", "array-contains", me).onSnapshot((s) => cb(rows(s), cached(s)), err),
    watchOpen: (cb, err) => db.collection("chats").where("open", "==", true).limit(300).onSnapshot((s) => cb(rows(s)), err),
    watchPeople: (cb, err) => db.collection("people").limit(1000).onSnapshot((s) => cb(rows(s), cached(s)), err),
    watchMsgs: (cid, cb, err) => db.collection("chats/" + cid + "/msgs").orderBy("t", "desc").limit(250).onSnapshot((s) => cb(rows(s).reverse()), err),
    watchPriv: (k, cb, err) => priv(k).onSnapshot((s) => cb(s.exists ? s.data() : null), err),
    getChat: async (cid) => { const s = await db.doc("chats/" + cid).get(); return s.exists ? Object.assign({ id: cid }, s.data()) : null; },
    setChat: (cid, d) => q("c/" + cid, () => db.doc("chats/" + cid).set(d)),
    patchChat: (cid, d) => q("c/" + cid, () => db.doc("chats/" + cid).update(d)),
    delChat: (cid) => q("c/" + cid, () => db.doc("chats/" + cid).delete()),
    setMsg: (cid, id, d) => q("m/" + cid + "/" + id, () => db.doc("chats/" + cid + "/msgs/" + id).set(d)),
    patchMsg: (cid, id, d) => q("m/" + cid + "/" + id, () => db.doc("chats/" + cid + "/msgs/" + id).update(d)),
    delMsg: (cid, id) => q("m/" + cid + "/" + id, () => db.doc("chats/" + cid + "/msgs/" + id).delete()),
    setPriv: (k, d) => q("p/" + k, () => priv(k).set(d)),
    getPriv: async (k) => { const s = await priv(k).get(); return s.exists ? s.data() : null; },
    delPriv: (k) => q("p/" + k, () => priv(k).delete()),
    setProfile: (d) => q("me", () => db.doc("people/" + me).set(d)),

function loadImage(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image(); img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); }; img.src = url; });
}
async function compress(file, max, budget, square) {
  const img = await loadImage(file);
  let w = img.naturalWidth, h = img.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
  if (square) { const s = Math.min(w, h); sx = (w - s) / 2; sy = (h - s) / 2; sw = sh = s; w = h = s; }
  const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
  const cv = document.createElement("canvas"); let out = "";
  for (let scale = 1; scale > 0.15; scale *= 0.8) {
    cv.width = Math.max(1, Math.round(w * scale)); cv.height = Math.max(1, Math.round(h * scale));
    const g = cv.getContext("2d"); g.fillStyle = "#ffffff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    for (let q = 0.82; q >= 0.46; q -= 0.12) { out = cv.toDataURL("image/jpeg", q); if (out.length <= budget) return { src: out, w: cv.width, h: cv.height }; }
  }
  return { src: out, w: cv.width, h: cv.height };
}

// A phone-book number to international digits, using my country code when it has none.
function normPhone(raw) {
  const s = String(raw || "").trim(); let d = s.replace(/\D/g, "");
  if (!d) return "";
  if (s.startsWith("+")) return d;
  if (d.startsWith("00")) return d.slice(2);
  const my = st.myPhone ? st.myPhone.code.replace(/\D/g, "") : "374";
  if (my === "7" && d.length === 11 && d[0] === "8") return "7" + d.slice(1);
  if (d.length === 11 && d[0] === "7") return d;
  if (d[0] === "0") d = d.slice(1);
  if (d.startsWith(my) && d.length > my.length + 7) return d;
  return my + d;
}
function parseVCF(text) {

    const fn = (card.match(/^FN[^:\n]*:(.*)$/im) || [])[1] || "";
    (card.match(/^(?:item\d+\.)?TEL[^:\n]*:(.*)$/gim) || []).forEach((line) => out.push({ name: fn.trim().slice(0, 40), tel: line.replace(/^[^:]*:/, "").trim() }));
  });

}

  const worker = async () => {
    while (i < todo.length) {

      try { const uid = await st.B.lookupPhone(phoneId(it.d)); if (uid && uid !== st.me) found.push({ uid, name: it.name, phone: "+" + it.d }); } catch (e) { if (e && e.code === "resource_exhausted") await new Promise((r) => setTimeout(r, 1500)); }
      done++; if (onProgress) onProgress(done, todo.length);

}

function onChats(list, fromCache) {
  const prev = st.chats;
  st.chats = new Map(list.map((c) => [c.id, c]));
  if (!st.chatsReady && !fromCache) { st.chatsReady = true; clearTimeout(st.loadTimer); st.netErr = ""; renderNet(); }
  // notify about new incoming messages
  if (st.chatsSeen) list.forEach((c) => {
    const old = prev.get(c.id), l = c.last;
    if (!l || l.sys || l.from === st.me) return;
    if (old && old.last && old.last.t >= l.t) return;
    if (!old && l.t < st.bootT) return;
    if (st.muted[c.id] || (st.active === c.id && !document.hidden)) return;
    toast(`${chatTitle(c)}: ${c.kind === "group" ? nameOf(l.from) + ": " : ""}${pv(l)}`, c.id); ping();
  });
  st.chatsSeen = true;
  if (st.wantOpen) { const w = st.wantOpen; st.wantOpen = null; if (getChat(w) && !st.active) openChat(w, { noFocus: true }); }
  if (st.active && !PSEUDO[st.active]) {
    const c = getChat(st.active);
    if (!c) closeChat();
    else { renderHead(); renderPin(); renderComposer(); renderMsgs(); markRead(); }
  }
  renderListSoon();
}
async function resolveNames(ids) {
  if (!st.user || typeof st.user.profiles !== "function" || !ids.length) return;
  try { const ps = await st.user.profiles(ids); let ch = false; ids.forEach((id) => { const n = ps && ps[id] && ps[id].name; if (n && st.names[id] !== n) { st.names[id] = n; ch = true; } }); if (ch) { renderListSoon(); renderMe(); if (st.active) { renderHead(); renderMsgs(); } } } catch (e) { /* names stay as nicknames */ }
}
function onPeople(list, fromCache) {
  st.people = new Map(list.map((p) => [p.id, p]));
  resolveNames(list.map((p) => p.id).concat([st.me]).filter((id) => !st.names[id] && !(st.people.get(id) || {}).nick));
  if (!fromCache && !st.profileLoaded) {
    st.profileLoaded = true;
    if (st.canWrite) {
      const mine = st.people.get(st.me);
      const p = mine ? Object.assign({}, mine, { seen: now() }) : { nick: "", bio: "", color: COLORS[parseInt(hash53(st.me).slice(-2), 36) % COLORS.length], emoji: "", photo: "", seen: now() };
      delete p.id; st.people.set(st.me, p);
      st.B.setProfile(p).catch((e) => { if (e && e.code === "invalid_argument" && st.mode === "db") { st.canWrite = false; renderNet(); if (st.active) renderComposer(); } });
    }

  renderMe(); renderListSoon(); if (st.active) { renderHead(); renderMsgs(); }
}
async function boot() {
  st.bootT = now();
  const has = !!(window.claude && typeof window.claude.use === "function");
  let db = null, user = null, me = null;
  if (has) { try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { db = null; user = null; } }
  if (user) { try { me = await user.id(); } catch (e) { me = null; } }
  st.user = user;
  if (db && me) {
    st.mode = "db"; st.me = me; st.B = dbBackend(db, me);
    try { const w = await user.can("data.write"); if (w === false) st.canWrite = false; } catch (e) { /* unknown: keep inputs */ }
    try { st.owner = !!(await user.isOwner()); } catch (e) { st.owner = false; }
  } else {
    st.mode = "local"; st.me = ls.get("localMe", "") || "local-" + rid(10); ls.set("localMe", st.me); st.B = localBackend(st.me);
  }
  renderNet(); renderMe();
  st.loadTimer = setTimeout(() => { if (!st.chatsReady && st.mode === "db") { st.netErr = "База Ayte отвечает медленно — список может быть неполным."; renderNet(); } }, 10000);
  st.B.watchChats(onChats, (e) => { st.netErr = "Чаты не загрузились: " + errText(e) + ". Откройте страницу заново."; renderNet(); });
  st.B.watchPeople(onPeople, () => {});
  st.B.watchPriv("contacts", (d) => { st.contacts = d && Array.isArray(d.items) ? d.items.filter((x) => x && typeof x.uid === "string").map((x) => Object.assign({}, x, { name: typeof x.name === "string" ? x.name.slice(0, 40) : "" })) : []; st.contactsAsked = !!(d && d.asked); st.contactsLoaded = true; renderListSoon(); maybeOnboard(); }, () => {});
  st.B.watchPriv("phone", (d) => { st.myPhone = d && d.num && COUNTRIES[+d.ci] ? { ci: +d.ci, code: COUNTRIES[+d.ci][1], num: String(d.num) } : null; st.phoneDoc = d || null; st.phoneKnown = true; st.phoneLoaded = true; renderListSoon(); maybeOnboard(); }, () => {});
  st.B.watchPriv("saved", (d) => { st.saved = d && Array.isArray(d.items) ? d.items : []; if (st.active === "saved") { st.msgs = st.saved; renderMsgs(); } renderListSoon(); }, () => {});
  st.B.watchPriv("ai", (d) => { if (st.aiBusy) return; st.ai = d && Array.isArray(d.items) ? d.items : []; if (st.active === "ai") { st.msgs = st.ai; renderMsgs(); } renderListSoon(); }, () => {});
  renderList();
  if (isWide()) { if (st.mode === "local") st.wantOpen = "k-welcome"; else openChat("ai", { noFocus: true }); }
  if (st.mode === "db") {
    try {
      const room = await window.claude.use("room");
      if (room) {
        st.room = room;
        room.onPeers(() => { st.peersRaw = room.peers(); recomputePeers(); }, () => { st.room = null; st.peersRaw = []; st.online = new Set([st.me]); st.typing = {}; renderNet(); renderListSoon(); });
        presence(null);
        renderNet();
      }
    } catch (e) { st.room = null; }
  }
}
boot();
})();
</script>
