<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>V3 Doccer Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root {
  --bg: #12132a; --panel: #1c1d3a; --panel-2: #26284a; --line: rgba(255,255,255,.12);
  --text: #f3f2ff; --muted: #a3a5c9; --amber: #ffb547; --amber-2: #ff8a1a; --red: #ff5a6a; --green: #4fd18b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 600 15px/1.4 Manrope, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.logo { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, var(--amber), var(--amber-2)); color: #1b1300; font-weight: 800; font-size: 24px; box-shadow: 0 8px 24px rgba(255,138,26,.3); }
.logo.sm { width: 34px; height: 34px; border-radius: 10px; font-size: 13px; box-shadow: none; }

/* ---------- lock screen ---------- */
#lock { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; text-align: center; }
#lock h1 { margin: 10px 0 0; font-size: 22px; }
#lock .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.dots { display: flex; gap: 14px; height: 18px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); transition: .15s; }
.dots i.on { background: var(--amber); border-color: var(--amber); transform: scale(1.1); }
.dots.bad { animation: shake .4s; } .dots.bad i { border-color: var(--red); }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.lmsg { margin: 0; min-height: 20px; color: var(--muted); font-size: 14px; }
.lmsg.err { color: var(--red); }
.pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
.pad button { height: 76px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); font-size: 26px; font-weight: 800; transition: transform .08s, background .15s; }
.pad button:active { transform: scale(.93); background: var(--panel-2); }
.pad button.flat { border-color: transparent; background: none; font-size: 22px; }
.pad button:disabled { opacity: .35; }
.owner { color: var(--muted); font-size: 12px; margin: 0; }

/* ---------- main ---------- */
.wrap { max-width: 760px; margin: 0 auto; padding: 12px 16px 40px; }
.top { display: flex; align-items: center; gap: 10px; padding: 4px 0 10px; }
.top .ttl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.top .ttl b { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .ttl small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
.ibtn { flex: none; width: 42px; height: 42px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-size: 18px; display: grid; place-items: center; }
.ibtn:active { background: var(--panel-2); }
.search { display: flex; gap: 8px; }
.search input, .search select, .field input, .field select { min-width: 0; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); outline: none; }
.search input { flex: 1; }
.search input:focus, .field input:focus, .note-title:focus, .note-text:focus { border-color: var(--amber); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; padding: 7px 12px; border-radius: 99px; border: 2px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 800; white-space: nowrap; }
.chips button[aria-pressed="true"] { border-color: var(--amber); background: rgba(255,181,71,.15); color: var(--amber); }
.chips button.add { border-style: dashed; color: var(--muted); }
.folderbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px; border-radius: 12px; background: var(--panel); font-size: 13px; }
.folderbar b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folderbar button { border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 800; padding: 4px 6px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 14px; border-radius: 14px; border: 0; background: linear-gradient(135deg, var(--amber), var(--amber-2)); color: #1b1300; font-weight: 800; text-align: center; }
.btn.ghost { background: var(--panel); color: var(--text); border: 2px solid var(--line); }
.btn.danger { background: var(--red); color: #fff; }
.btn:active { filter: brightness(.92); }
.btn:disabled { opacity: .5; }
.stats { margin: 12px 2px 6px; color: var(--muted); font-size: 12px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.doc { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 10px 12px; border-radius: 14px; border: 2px solid transparent; background: var(--panel); text-align: left; }
.doc:active { border-color: var(--line); background: var(--panel-2); }
.doc .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: var(--panel-2); overflow: hidden; }
.doc .nm { display: block; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc .mt { display: block; color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc .fav { color: var(--amber); font-size: 16px; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.empty div { font-size: 44px; margin-bottom: 6px; }
.drop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(18,19,42,.88); border: 3px dashed var(--amber); font-size: 20px; font-weight: 800; color: var(--amber); pointer-events: none; }

/* ---------- viewer ---------- */
#viewer { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto; }
.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.tools button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-size: 11px; font-weight: 800; color: var(--muted); }
.tools button i { font-style: normal; font-size: 18px; }
.tools button.del { color: var(--red); }
.note-title { width: 100%; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-size: 18px; font-weight: 800; outline: none; }
.note-text { width: 100%; min-height: 55vh; margin-top: 8px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font: 600 15px/1.55 Manrope, sans-serif; resize: vertical; outline: none; }
.saved { margin: 6px 2px 0; color: var(--muted); font-size: 12px; }
.preview { border-radius: 14px; overflow: hidden; background: var(--panel); }
.preview img, .preview video { display: block; max-width: 100%; margin: 0 auto; }
.preview iframe { display: block; width: 100%; height: 72vh; border: 0; background: #fff; }
.preview audio { display: block; width: 100%; padding: 14px; }
.preview pre { margin: 0; padding: 14px; max-height: 70vh; overflow: auto; font: 500 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
.preview .none { padding: 40px 16px; text-align: center; color: var(--muted); }
.preview .none div { font-size: 52px; }
.info { margin-top: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 12px; border-radius: 14px; background: var(--panel); font-size: 13px; }
.info span { color: var(--muted); }
.info b { overflow-wrap: anywhere; }

/* ---------- sheet / toast ---------- */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.55); }
.sheet-card { width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; background: var(--panel); border-top: 2px solid var(--line); animation: up .2s ease-out; }
@media (min-width: 600px) { .sheet { align-items: center; } .sheet-card { border-radius: 22px; border: 2px solid var(--line); } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet-card h3 { margin: 0 0 4px; font-size: 18px; }
.sheet-card p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.sheet-card .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.sheet-card .field input { background: var(--panel-2); color: var(--text); font-size: 15px; }
.sheet-card .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.sheet-card .opts { display: flex; flex-direction: column; gap: 6px; }
.sheet-card .opts button { padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel-2); text-align: left; font-weight: 800; }
.sheet-card .opts button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.sheet-card .opts button.del { color: var(--red); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 40; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: #2f3160; box-shadow: 0 8px 24px rgba(0,0,0,.4); font-size: 14px; font-weight: 800; transition: opacity .2s; }
.toast.off { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<!-- ===== Lock ===== -->
<section id="lock">
  <div>
    <div class="logo">V3</div>
    <h1>Doccer Management</h1>
    <p class="sub">Личный сейф документов</p>
  </div>
  <div class="dots" id="dots"></div>
  <p class="lmsg" id="lmsg">Введи пароль</p>
  <div class="pad" id="pad"></div>
  <p class="owner">🔐 Только для владельца · данные зашифрованы на этом устройстве</p>
</section>

<!-- ===== Main ===== -->
<section id="app" hidden>
  <div class="wrap">
    <header class="top">
      <div class="ttl"><span class="logo sm">V3</span><div><b>Doccer Management</b><small>Мои документы</small></div></div>
      <button class="ibtn" type="button" id="setBtn" aria-label="Настройки">⚙️</button>
      <button class="ibtn" type="button" id="lockBtn" aria-label="Заблокировать">🔒</button>
    </header>
    <div class="search">
      <input id="q" type="search" placeholder="🔍 Поиск по документам" autocomplete="off">
      <select id="sort" aria-label="Сортировка">
        <option value="new">Новые</option>
        <option value="old">Старые</option>
        <option value="az">А–Я</option>
        <option value="size">Размер</option>
      </select>
    </div>
    <nav class="chips" id="chips"></nav>
    <div class="folderbar" id="folderbar" hidden><span>📁</span><b id="fbName"></b><button type="button" id="fbRename">Переименовать</button><button type="button" id="fbDelete">Удалить</button></div>
    <div class="actions">
      <button class="btn" type="button" id="newNote">📝 Новая заметка</button>
      <button class="btn ghost" type="button" id="upBtn">⬆️ Загрузить файлы</button>
      <input type="file" id="fileIn" multiple hidden>
    </div>
    <p class="stats" id="stats"></p>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden><div>🗂️</div><b id="emptyT">Пока пусто</b><br><span id="emptyS">Создай заметку или загрузи файл</span></div>
  </div>
</section>

<!-- ===== Viewer ===== -->
<section id="viewer" hidden>
  <div class="wrap">
    <header class="top">
      <button class="ibtn" type="button" id="vBack" aria-label="Назад">←</button>
      <div class="ttl"><div style="min-width:0"><b id="vName"></b><small id="vSub"></small></div></div>
      <button class="ibtn" type="button" id="vFav" aria-label="Избранное">☆</button>
    </header>
    <div class="tools">
      <button type="button" id="vRename"><i>✏️</i>Имя</button>
      <button type="button" id="vMove"><i>📁</i>Папка</button>
      <button type="button" id="vDown"><i>⬇️</i>Скачать</button>
      <button type="button" id="vDel" class="del"><i>🗑️</i>Удалить</button>
    </div>
    <div id="vBody"></div>
  </div>
</section>

<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
<div class="drop" id="drop" hidden>Отпусти, чтобы добавить файлы</div>
<div class="toast off" id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const te = new TextEncoder(), td = new TextDecoder();

  /* ---------- password ---------- */
  // Only a PBKDF2 hash of the password is kept here, never the password itself.
  // The same derivation also gives the AES key that encrypts every document.
  const ITER = 150000;
  const DEFAULT_AUTH = { salt: "djMtZG9jY2VyLW1hbmFnZW1lbnQtMjAyNg==", ver: "6fd58c64f8cd179c5f100bc3810902a7e6d3d67e0239f2105fe68a421c7046a8", len: 4 };
  const AUTO_LOCK_MS = 5 * 60 * 1000;   // no taps for 5 minutes
  const AWAY_LOCK_MS = 60 * 1000;       // app hidden for over a minute

  const b64e = (buf) => { const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const b64d = (s) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
  const hex = (u) => Array.from(u, (b) => b.toString(16).padStart(2, "0")).join("");

  async function derive(pin, salt) {
    const base = await crypto.subtle.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(salt), iterations: ITER }, base, 512));
    const key = await crypto.subtle.importKey("raw", bits.slice(32), "AES-GCM", false, ["encrypt", "decrypt"]);
    return { ver: hex(bits.slice(0, 32)), key };
  }
  async function seal(key, buf) { const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv, data: await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, buf) }; }
  const unseal = (key, box) => crypto.subtle.decrypt({ name: "AES-GCM", iv: box.iv }, key, box.data);
  const sealJSON = (key, obj) => seal(key, te.encode(JSON.stringify(obj)));
  const unsealJSON = async (key, box) => JSON.parse(td.decode(await unseal(key, box)));

  /* ---------- storage (IndexedDB) ---------- */
  // docs: id -> encrypted metadata (name, folder, note text…); files: id -> encrypted file body; meta: auth + folders
  const DB = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open("v3-doccer", 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("docs", { keyPath: "id" }); d.createObjectStore("files"); d.createObjectStore("meta"); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
    const done = (t) => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("abort")); });
    async function read(store, fn) { const t = (await open()).transaction(store, "readonly"); const r = fn(t.objectStore(store)); await done(t); return r.result; }
    // ops: [store, "put"|"delete", value, key?]
    async function write(ops) {
      const stores = [...new Set(ops.map((o) => o[0]))];
      const t = (await open()).transaction(stores, "readwrite");
      ops.forEach(([s, op, v, k]) => { const st = t.objectStore(s); if (op === "put") (k === undefined ? st.put(v) : st.put(v, k)); else if (op === "delete") st.delete(v); else if (op === "clear") st.clear(); });
      return done(t);
    }
    return {
      get: (s, k) => read(s, (st) => st.get(k)),
      all: (s) => read(s, (st) => st.getAll()),
      keys: (s) => read(s, (st) => st.getAllKeys()),
      write,
    };
  })();

  /* ---------- state ---------- */
  let KEY = null, auth = DEFAULT_AUTH;
  let docs = [], folders = [];
  let view = "all", query = "", sort = "new", openDoc = null, urls = [];
  let lastAct = Date.now(), hiddenAt = 0;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  const fmtSize = (n) => n < 1024 ? n + " Б" : n < 1048576 ? (n / 1024).toFixed(n < 10240 ? 1 : 0) + " КБ" : (n / 1048576).toFixed(1) + " МБ";
  function fmtDate(t) {
    const d = new Date(t), now = new Date();
    const o = { day: "numeric", month: "short" }; if (d.getFullYear() !== now.getFullYear()) o.year = "numeric";
    if (d.toDateString() === now.toDateString()) return "сегодня, " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    return d.toLocaleDateString("ru-RU", o);
  }
  function icon(d) {
    if (d.kind === "note") return "📝";
    const m = d.mime || "", n = (d.name || "").toLowerCase();
    if (m.startsWith("image/")) return "🖼️";
    if (m === "application/pdf" || n.endsWith(".pdf")) return "📕";
    if (m.startsWith("audio/")) return "🎵";
    if (m.startsWith("video/")) return "🎬";
    if (/zip|rar|7z|tar|gzip/.test(m) || /\.(zip|rar|7z|gz)$/.test(n)) return "🗜️";
    if (/word|opendocument\.text/.test(m) || /\.docx?$/.test(n)) return "📘";
    if (/sheet|excel|csv/.test(m) || /\.(xlsx?|csv)$/.test(n)) return "📗";
    if (/presentation|powerpoint/.test(m) || /\.pptx?$/.test(n)) return "📙";
    if (m.startsWith("text/") || /json|xml|javascript/.test(m)) return "📄";
    return "📦";
  }
  const isText = (d) => (d.mime || "").startsWith("text/") || /json|xml|javascript/.test(d.mime || "") || /\.(txt|md|csv|json|log|xml|html?|css|js)$/i.test(d.name || "");
  const folderName = (id) => (folders.find((f) => f.id === id) || {}).name || "";

  let toastT = 0;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.remove("off"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add("off"), 2200); }

  /* ---------- sheet dialogs ---------- */
  function sheet(build) {
    return new Promise((resolve) => {
      const s = $("#sheet"), c = $("#sheetCard");
      c.replaceChildren(); s.hidden = false;
      const close = (v) => { s.hidden = true; c.replaceChildren(); s.onclick = null; resolve(v); };
      s.onclick = (e) => { if (e.target === s) close(null); };
      build(c, close);
    });
  }
  function ask({ title, text, value = "", placeholder = "", ok = "Готово", type = "text" }) {
    return sheet((c, close) => {
      c.append(el("h3", "", title)); if (text) c.append(el("p", "", text));
      const f = el("label", "field"), inp = el("input"); inp.type = type; inp.value = value; inp.placeholder = placeholder;
      if (type === "password") { inp.inputMode = "numeric"; inp.autocomplete = "off"; }
      f.append(inp); c.append(f);
      const row = el("div", "row"), no = el("button", "btn ghost", "Отмена"), yes = el("button", "btn", ok);
      no.type = yes.type = "button"; row.append(no, yes); c.append(row);
      no.onclick = () => close(null);
      yes.onclick = () => close(inp.value.trim());
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") yes.click(); });
      setTimeout(() => { inp.focus(); inp.select(); }, 60);
    });
  }
  function confirmBox({ title, text, ok = "Удалить" }) {
    return sheet((c, close) => {
      c.append(el("h3", "", title)); if (text) c.append(el("p", "", text));
      const row = el("div", "row"), no = el("button", "btn ghost", "Отмена"), yes = el("button", "btn danger", ok);
      no.type = yes.type = "button"; row.append(no, yes); c.append(row);
      no.onclick = () => close(false); yes.onclick = () => close(true);
    });
  }
  function choose({ title, text, options }) {
    return sheet((c, close) => {
      c.append(el("h3", "", title)); if (text) c.append(el("p", "", text));
      const box = el("div", "opts");
      options.forEach((o) => { const b = el("button", o.cls || "", o.label); b.type = "button"; if (o.on) b.setAttribute("aria-pressed", "true"); b.onclick = () => close(o.value); box.append(b); });
      const cancel = el("button", "", "Отмена"); cancel.type = "button"; cancel.style.color = "var(--muted)"; cancel.onclick = () => close(null); box.append(cancel);
      c.append(box);
    });
  }

  /* ---------- lock screen ---------- */
  let pin = "", busy = false;
  const failInfo = () => { try { return JSON.parse(localStorage.getItem("doccer-fails")) || { n: 0, until: 0 }; } catch (e) { return { n: 0, until: 0 }; } };
  const setFail = (v) => { try { localStorage.setItem("doccer-fails", JSON.stringify(v)); } catch (e) {} };
  function drawDots() {
    const d = $("#dots"); d.replaceChildren();
    const n = Math.max(auth.len || 4, pin.length);
    for (let i = 0; i < n; i++) { const dot = el("i"); if (i < pin.length) dot.className = "on"; d.append(dot); }
  }

  });
  ["pointerdown", "input", "scroll"].forEach((ev) => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
  setInterval(() => { if (KEY && Date.now() - lastAct > AUTO_LOCK_MS) flush().then(lock); }, 5000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { hiddenAt = Date.now(); flush(); }
    else if (KEY && hiddenAt && Date.now() - hiddenAt > AWAY_LOCK_MS) lock();
  });
  addEventListener("pagehide", () => { flush(); });

  /* ---------- start ---------- */
  (async () => {
    buildPad(); drawDots();
    if (!window.crypto || !crypto.subtle || !window.indexedDB) { lmsg("Этот браузер не поддерживает шифрование. Открой страницу по https.", true); return; }
    try { const a = await DB.get("meta", "auth"); if (a && a.salt && a.ver) auth = a; } catch (e) { console.error(e); }
    drawDots(); if (lockedFor() > 0) showWait();
  })();
})();
</script>
