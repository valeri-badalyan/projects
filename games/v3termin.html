<!doctype html>
<html lang="ru">

<style>

* { box-sizing: border-box; }

body { display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }

<script>
(() => {
  "use strict";
  const $ = (q) => document.querySelector(q);
  // Same storage keys as the V3 console ("v3:<key>"), so files and history are shared with it.
  const store = {
    get(k, d) { try { const v = localStorage.getItem("v3:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("v3:" + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  };
  /* ================= V3TERMIN ================= */
  // A PowerShell-style terminal: Verb-Noun cmdlets with aliases, a pipeline that passes objects,
  // $variables, arithmetic, script blocks for Where-Object / ForEach-Object, a virtual drive C:\
  // kept in localStorage, .ps1 scripts and a tiny notepad. Start-Process opens the console's games.
  const V3Term = (() => {
    const S = store.get("v3term", null) || {};
    if (!S.fs) S.fs = null;
    S.runs = S.runs || 0; S.hist = Array.isArray(S.hist) ? S.hist.slice(-200) : []; S.cwd = S.cwd || "C:\\Users\\Player";
    S.vars = S.vars && typeof S.vars === "object" ? S.vars : {};
    S.seen = S.seen && typeof S.seen === "object" ? S.seen : {};
    const save = () => store.set("v3term", S);
    const now = () => Date.now();
    const F = (t) => ({ k: "f", t: t || "", m: now() });
    const D = (c) => ({ k: "d", c: c || {}, m: now() });
    function freshFs() {
      return D({
        Users: D({ Player: D({
          Desktop: D({ "привет.txt": F("Привет! Это V3TERMIN.\nНапиши Get-Help, чтобы увидеть все команды.") }),
          Documents: D({ "readme.txt": F("V3TERMIN — терминал приставки V3.\nКоманды похожи на PowerShell: Get-ChildItem, Set-Location, Get-Content...\nАлиасы тоже работают: ls, dir, cd, cat, echo, cls."), "hello.ps1": F("Write-Host \"Привет из скрипта!\" -ForegroundColor Green\n$n = Get-Random -Minimum 1 -Maximum 100\nWrite-Output \"Случайное число: $n\"") }),
          Games: D({}), Downloads: D({}), Pictures: D({}) }) }),
        Windows: D({ System32: D({ "drivers.sys": F("<двоичные данные>"), "v3kernel.dll": F("<двоичные данные>") }), "win.ini": F("[V3]\nversion=3.0\ntheme=blue") }),
        "Program Files": D({ V3: D({ "V3Termin.exe": F("<двоичные данные>"), "license.txt": F("V3 Corporation. Все права защищены.") }) }),
      });
    }
    if (!S.fs || S.fs.k !== "d") S.fs = freshFs();

    // ---------- paths ----------
    const split = (p) => p.replace(/\//g, "\\").split("\\").filter((x) => x && x !== ".");
    function norm(p) {
      p = String(p == null ? "" : p).trim();
      if (!p) return S.cwd;
      if (p === "~" || /^~[\\/]/.test(p)) p = "C:\\Users\\Player" + p.slice(1);
      let parts;
      if (/^[a-z]:/i.test(p)) { if (!/^c:/i.test(p)) return null; parts = split(p.slice(2)); }
      else if (/^[\\/]/.test(p)) parts = split(p);
      else parts = split(S.cwd.slice(2)).concat(split(p));
      const out = [];
      parts.forEach((x) => { if (x === "..") out.pop(); else out.push(x); });
      return "C:\\" + out.join("\\");
    }
    function walk(abs) {
      if (!abs) return null;
      let n = S.fs; const parts = split(abs.slice(2)), real = [];
      for (const x of parts) {
        if (!n || n.k !== "d") return null;
        const key = Object.keys(n.c).find((k) => k.toLowerCase() === x.toLowerCase());
        if (!key) return null; real.push(key); n = n.c[key];
      }
      return { node: n, path: "C:\\" + real.join("\\") };
    }
    function parentOf(abs) { const parts = split(abs.slice(2)); const name = parts.pop(); return { dir: walk("C:\\" + parts.join("\\")), name }; }
    const pretty = (abs) => abs === "C:\\" ? "C:\\" : abs;
    const wild = (pat) => new RegExp("^" + String(pat).replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, ".") + "$", "i");

    // ---------- errors ----------
    class PSErr extends Error { constructor(m, cat) { super(m); this.cat = cat || "InvalidOperation"; } }
    const err = (m, cat) => { throw new PSErr(m, cat); };

    // ---------- tokenizer ----------
    function tokenize(src) {
      const T = []; let i = 0;
      while (i < src.length) {
        const c = src[i];
        if (/\s/.test(c)) { i++; continue; }
        if (c === "#") break;
        if (c === "|") { T.push({ t: "pipe" }); i++; continue; }
        if (c === ";") { T.push({ t: "semi" }); i++; continue; }
        if (c === "(" || c === ")" || c === "," || c === "[" || c === "]") { T.push({ t: c }); i++; continue; }
        if (c === "{") {
          let d = 0, j = i;
          for (; j < src.length; j++) { if (src[j] === "{") d++; else if (src[j] === "}" && --d === 0) break; }
          if (j >= src.length) err("Отсутствует закрывающая скобка \"}\" в блоке инструкций.", "ParserError");
          T.push({ t: "block", v: src.slice(i + 1, j) }); i = j + 1; continue;
        }
        if (c === '"' || c === "'") {
          let j = i + 1, s = "";
          while (j < src.length && src[j] !== c) { if (src[j] === "`" && c === '"' && j + 1 < src.length) { const e = src[++j]; s += e === "n" ? "\n" : e === "t" ? "\t" : e; } else s += src[j]; j++; }
          if (j >= src.length) err("В строке отсутствует завершающий символ: " + c + ".", "ParserError");
          T.push({ t: "str", v: s, q: c }); i = j + 1; continue;
        }
        if (c === "$") {
          const m = /^\$([A-Za-z_][\w]*|_|\?)((?:\.[A-Za-z_]\w*)*)/.exec(src.slice(i));
          if (!m) { T.push({ t: "word", v: "$" }); i++; continue; }
          T.push({ t: "var", v: m[1], props: m[2] ? m[2].slice(1).split(".") : [] }); i += m[0].length; continue;
        }
        const rg = /^(\d+)\.\.(?=[\d$(-])/.exec(src.slice(i));
        if (rg) { T.push({ t: "num", v: +rg[1] }, { t: "word", v: ".." }); i += rg[0].length; continue; }
        if (src.startsWith("..", i) && /[\d$(]/.test(src[i + 2] || "") && T.length && /num|var|\)/.test(T[T.length - 1].t)) { T.push({ t: "word", v: ".." }); i += 2; continue; }
        const n = /^\d+(\.\d+)?(kb|mb|gb)?(?![\w\\/:.])/i.exec(src.slice(i));
        if (n) { const mul = { kb: 1024, mb: 1048576, gb: 1073741824 }[(n[2] || "").toLowerCase()] || 1; T.push({ t: "num", v: parseFloat(n[0]) * mul }); i += n[0].length; continue; }
        if (c === "=" && src[i + 1] !== "=") { T.push({ t: "assign" }); i++; continue; }
        const prevVal = T.length && /^(num|str|var|\)|\])$/.test(T[T.length - 1].t);
        if (("+*/%".includes(c) && (prevVal || src[i + 1] === "=")) || (c === "-" && /[\s\d($=]/.test(src[i + 1] || " "))) { T.push({ t: "op", v: c }); i++; continue; }
        if (c === "!" ) { T.push({ t: "op", v: "!" }); i++; continue; }
        let j = i; while (j < src.length && !/[\s|;(){},[\]]/.test(src[j]) && !(src[j] === "=" && j > i && src[j - 1] !== "-")) j++;
        if (j === i) j = i + 1;
        T.push({ t: "word", v: src.slice(i, j) }); i = j;
      }
      return T;
    }
    function splitBy(T, kind) { const out = [[]]; T.forEach((x) => { if (x.t === kind) out.push([]); else out[out.length - 1].push(x); }); return out; }

    // ---------- values ----------
    function getVar(name, ctx) {
      const k = name.toLowerCase();
      if (ctx && k === "_") return ctx.it;
      if (k === "true") return true; if (k === "false") return false; if (k === "null") return null;
      if (k === "home") return "C:\\Users\\Player"; if (k === "pwd") return S.cwd; if (k === "?") return lastOk;
      if (k === "psversiontable") return { PSVersion: "3.0.2026", PSEdition: "V3", Platform: "V3 Console", OS: "V3 OS" };
      if (k === "host") return { Name: "V3TERMIN Host", Version: "3.0", UI: "Console" };
      return Object.prototype.hasOwnProperty.call(S.vars, k) ? S.vars[k] : null;
    }
    function prop(v, p) {
      if (v == null) return null;
      if (Array.isArray(v)) { if (/^(count|length)$/i.test(p)) return v.length; return v.map((x) => prop(x, p)); }
      if (/^count$/i.test(p)) return 1;
      if (typeof v === "string") { if (/^length$/i.test(p)) return v.length; return null; }
      if (typeof v === "object") { const key = Object.keys(v).find((k) => k.toLowerCase() === p.toLowerCase()); return key ? v[key] : null; }
      return null;
    }
    const interp = (s, ctx) => s.replace(/\$(\{?)([A-Za-z_]\w*|_)\}?((?:\.[A-Za-z_]\w*)*)/g, (m, b, n, pr) => { let v = getVar(n, ctx); if (pr) pr.slice(1).split(".").forEach((p) => { v = prop(v, p); }); return str(v); });
    function str(v) {
      if (v == null) return "";
      if (Array.isArray(v)) return v.map(str).join(" ");
      if (typeof v === "boolean") return v ? "True" : "False";
      if (typeof v === "number") return String(Math.round(v * 1e10) / 1e10);
      if (typeof v === "object") return v.Name != null ? String(v.Name) : "@{" + Object.keys(v).filter((k) => k[0] !== "_").map((k) => k + "=" + str(v[k])).join("; ") + "}";
      return String(v);
    }
    const num = (v) => { if (typeof v === "number") return v; const n = parseFloat(String(v).replace(",", ".")); if (isNaN(n)) err(`Не удается преобразовать значение "${str(v)}" в тип "System.Int32".`, "InvalidArgument"); return n; };
    const truthy = (v) => Array.isArray(v) ? v.length > 0 : !!v && v !== "0";

    // ---------- expressions ----------
    const CMP = ["-eq", "-ne", "-gt", "-lt", "-ge", "-le", "-like", "-notlike", "-match", "-contains"];
    function isExprStart(t) { return t && (t.t === "num" || t.t === "str" || t.t === "var" || t.t === "(" || t.t === "[" || (t.t === "op" && (t.v === "-" || t.v === "!"))); }
    function evalExpr(T, ctx) {
      let p = 0;
      const peek = () => T[p], low = () => (T[p] && T[p].t === "word" ? T[p].v.toLowerCase() : "");
      function or() { let a = and(); while (low() === "-or") { p++; const b = and(); a = truthy(a) || truthy(b); } return a; }
      function and() { let a = cmp(); while (low() === "-and") { p++; const b = cmp(); a = truthy(a) && truthy(b); } return a; }
      function cmp() {
        let a = add();
        while (CMP.includes(low())) {
          const o = T[p++].v.toLowerCase(), b = add();
          const bothNum = typeof a === "number" || typeof b === "number";
          const A = bothNum && !isNaN(parseFloat(a)) ? num(a) : str(a).toLowerCase(), B = bothNum && !isNaN(parseFloat(b)) ? num(b) : str(b).toLowerCase();
          if (o === "-eq") a = A === B; else if (o === "-ne") a = A !== B; else if (o === "-gt") a = A > B; else if (o === "-lt") a = A < B;
          else if (o === "-ge") a = A >= B; else if (o === "-le") a = A <= B; else if (o === "-like") a = wild(b).test(str(a)); else if (o === "-notlike") a = !wild(b).test(str(a));
          else if (o === "-match") { try { a = new RegExp(str(b), "i").test(str(a)); } catch (e) { err("Неверное регулярное выражение.", "InvalidArgument"); } }
          else if (o === "-contains") a = (Array.isArray(a) ? a : [a]).some((x) => str(x).toLowerCase() === str(b).toLowerCase());
        }
        return a;
      }
      function add() {
        let a = mul();
        while (peek() && peek().t === "op" && (peek().v === "+" || peek().v === "-")) {
          const o = T[p++].v, b = mul();
          if (o === "+") a = Array.isArray(a) ? a.concat(b) : typeof a === "string" ? a + str(b) : num(a) + num(b); else a = num(a) - num(b);
        }
        return a;
      }
      function mul() {
        let a = unary();
        while (peek() && peek().t === "op" && "*/%".includes(peek().v)) {
          const o = T[p++].v, b = unary();
          if (o === "*") a = typeof a === "string" ? a.repeat(Math.max(0, Math.min(1000, num(b)))) : num(a) * num(b);
          else if (o === "/") { if (num(b) === 0) err("Попытка деления на нуль.", "RuntimeException"); a = num(a) / num(b); } else a = num(a) % num(b);
        }
        return a;
      }
      function unary() {
        const t = peek();
        if (t && t.t === "op" && t.v === "-") { p++; return -num(unary()); }
        if (t && t.t === "op" && t.v === "!") { p++; return !truthy(unary()); }
        if (low() === "-not") { p++; return !truthy(unary()); }
        return range();
      }
      function range() {
        let a = atom();
        if (peek() && peek().t === "word" && peek().v === "..") { p++; const b = num(atom()); const out = []; const s = num(a); const st = s <= b ? 1 : -1; for (let x = s; st > 0 ? x <= b : x >= b; x += st) { out.push(x); if (out.length > 10000) break; } return out; }
        return a;
      }
      function atom() {
        const v = atom1();
        if (T[p] && T[p].t === ",") { const arr = [v]; while (T[p] && T[p].t === ",") { p++; arr.push(atom1()); } return arr; }
        return v;
      }
      function atom1() {
        const t = T[p++];
        if (!t) err("Ожидалось выражение.", "ParserError");
        let v;
        if (t.t === "num") v = t.v;
        else if (t.t === "str") v = t.q === '"' ? interp(t.v, ctx) : t.v;
        else if (t.t === "var") { v = getVar(t.v, ctx); t.props.forEach((x) => { v = prop(v, x); }); }
        else if (t.t === "(") {
          let d = 1, j = p; for (; j < T.length; j++) { if (T[j].t === "(") d++; else if (T[j].t === ")" && --d === 0) break; }
          const inner = T.slice(p, j); p = j + 1;
          v = isExprStart(inner[0]) && !inner.some((x) => x.t === "pipe") ? evalExpr(inner, ctx) : unwrap(runPipelineSync(inner, ctx));
          while (T[p] && T[p].t === "word" && T[p].v[0] === ".") { T[p].v.slice(1).split(".").forEach((x) => { v = prop(v, x); }); p++; }
        } else if (t.t === "[") {
          const ty = T[p] && T[p].v; p += 2; const x = atom1(); const k = String(ty).toLowerCase();
          v = k === "int" ? Math.round(num(x)) : k === "string" ? str(x) : k === "math" ? x : x;
        } else v = t.v;
        return v;
      }
      const r = or();
      if (p < T.length) err(`Непредвиденная лексема "${T[p].v || T[p].t}" в выражении или операторе.`, "ParserError");
      return r;
    }
    const unwrap = (a) => (Array.isArray(a) && a.length === 1 ? a[0] : a);

    // ---------- objects ----------
    const fmtDate = (t) => { const d = new Date(t); const p = (n) => String(n).padStart(2, "0"); return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}     ${p(d.getHours())}:${p(d.getMinutes())}`; };
    function item(name, node, dir) {
      const isD = node.k === "d";
      return { _t: "fs", _dir: dir, Mode: isD ? "d-----" : "-a----", LastWriteTime: fmtDate(node.m || now()), Length: isD ? "" : new Blob([node.t]).size, Name: name, FullName: (dir === "C:\\" ? "C:\\" : dir + "\\") + name, Extension: isD ? "" : (/\.[^.]+$/.exec(name) || [""])[0] };
    }
    const PROCS = () => {
      const base = [["Idle", 0, 0], ["System", 4, 0.1], ["v3kernel", 88, 2], ["explorer", 1204, 12.5], ["V3Termin", 4321, 1.3], ["audiodg", 2210, 0.4]];
      const gm = Object.keys(GAMEMAP).slice(0, 8).map((g, i) => [g, 5000 + i * 37, 0]);
      return base.concat(gm).map(([n, id, cpu]) => ({ _t: "proc", Handles: 100 + (id * 7) % 900, "NPM(K)": 5 + id % 40, "PM(K)": 1000 + (id * 13) % 90000, "WS(K)": 2000 + (id * 17) % 120000, "CPU(s)": cpu + Math.round(Math.random() * 10) / 10, Id: id, ProcessName: n }));

      else if (e.ctrlKey && e.key.toLowerCase() === "l") { e.preventDefault(); out.textContent = ""; }
      else if (e.key === "Escape") { e.preventDefault(); inp.value = ""; }
    });
    scr.addEventListener("click", () => { if (!String(window.getSelection && window.getSelection()) ) inp.focus(); });
    $("#vtrKeys").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k;
      if (k === "tab") complete(); else if (k === "up") histMove(-1); else if (k === "down") histMove(1); else if (k === "ctrlc") ctrlC(); else if (k === "enter") submit();
      else if (b.dataset.cmd) { inp.value = b.dataset.cmd; submit(); }
      inp.focus();
    });
    $("#vtrFont").addEventListener("click", () => { S.big = !S.big; save(); $("#vtrWin").classList.toggle("big", !!S.big); });

    function banner() {
      line("V3TERMIN"); line("(C) Корпорация V3 (V3 Corporation). Все права защищены."); line("");
      line("Установите последнюю версию V3TERMIN для новых функций и улучшения! https://v3.games/termin"); line("");
      line("Введите Get-Help, чтобы увидеть список команд, или Get-Game — список игр.", "", COLORS.yellow); line("");
    }
    let started = false;
    return {
      enter() {
        if (!started) { started = true; banner(); }
        $("#vtrWin").classList.toggle("big", !!S.big);
        setPrompt(); scr.scrollTop = scr.scrollHeight;
        if (!matchMedia("(pointer: coarse)").matches) setTimeout(() => inp.focus(), 50);
      },
      leave() { cancel = true; $("#vtrNp").hidden = true; },
      key() {},
      best: () => (S.runs ? Object.keys(S.seen).length + "/" + Object.keys(CMDS).length : "—"),
    };
  })();

  V3Term.enter();
  $("#vtrExit").addEventListener("click", () => { const i = $("#vtrIn"); i.value = "exit"; i.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true })); });
  addEventListener("pagehide", () => V3Term.leave());
})();
</script>
</body>
